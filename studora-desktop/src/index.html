<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" />
  <title>Studora – Skolplattform</title>
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { getConfigFromEnv, getSupabaseClient } from './lib.ts';

    const app = document.getElementById('app');

    async function init() {
      try {
        const config = getConfigFromEnv();

        if (!config.supabaseUrl || !config.supabaseKey) {
          app.innerHTML = `
            <div class="error-screen">
              <h1>Konfigurationsfel</h1>
              <p>Supabase-konfiguration saknas. Kontakta systemadministratören.</p>
              <div class="error-details">
                <p><strong>SUPABASE_URL:</strong> ${config.supabaseUrl || 'Ej konfigurerad'}</p>
                <p><strong>SUPABASE_PUBLISHABLE_KEY:</strong> ${config.supabaseKey ? config.supabaseKey.substring(0, 8) + '...' : 'Ej konfigurerad'}</p>
              </div>
            </div>
          `;
          return;
        }

        window.STUDORA_CONFIG = config;

        const supabase = getSupabaseClient();

        const hash = window.location.hash;

        if (hash.startsWith('#/reset')) {
          const { renderResetPage } = await import('./app.ts');
          renderResetPage(app);
          return;
        }

        if (hash.startsWith('#/app')) {
          const params = new URLSearchParams(hash.split('?')[1] || '');
          const name = params.get('name') || '';
          const role = params.get('role') || '';

          if (name && role) {
            const { renderApp } = await import('./app.ts');
            renderApp(app, name, role);
            return;
          }
        }

        const { data } = await supabase.auth.getSession();

        if (data.session) {
          const { fetchProfile } = await import('./lib.ts');
          const { profile, error } = await fetchProfile();

          if (profile && !error) {
            const role = profile.role || '';
            const name = profile.full_name || profile.username || 'Användare';

            window.location.hash = `#/app?name=${encodeURIComponent(name)}&role=${encodeURIComponent(role)}`;
            window.location.reload();
            return;
          }
        }

        const { renderLogin } = await import('./login.ts');
        renderLogin(app);

      } catch (err) {
        app.innerHTML = `
          <div class="error-screen">
            <h1>Ett fel uppstod</h1>
            <p>${escapeHtml(String(err))}</p>
          </div>
        `;
      }
    }

    function escapeHtml(str: string): string {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
