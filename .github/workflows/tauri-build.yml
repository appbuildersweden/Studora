name: Build Tauri Windows App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: studora-desktop/package-lock.json

      - name: Install npm dependencies
        run: cd studora-desktop && npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            studora-desktop/src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build frontend
        run: cd studora-desktop && npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Tauri Windows app
        run: cd studora-desktop && npx tauri build
        env:
          TAURI_TOKEN: ${{ secrets.TAURI_TOKEN }}

      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studora-windows-installer
          path: |
            studora-desktop/src-tauri/target/release/bundle/nsis/*.exe
            studora-desktop/src-tauri/target/release/bundle/nsis/*.msi
          retention-days: 30

      - name: Create GitHub Release (for tagged builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            studora-desktop/src-tauri/target/release/bundle/nsis/*.exe
            studora-desktop/src-tauri/target/release/bundle/nsis/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Tauri update (for tagged builds)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd studora-desktop
          npx tauri publish --verbose
        env:
          TAURI_TOKEN: ${{ secrets.TAURI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
